<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ink88 - ASCII Art Gallery</title>
  <style>
    body {
      background-color: #fdf6e3;
      color: #2c2c2c;
      font-family: 'Times New Roman', Times, serif;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 42px;
      margin: 0;
      font-weight: normal;
      letter-spacing: 6px;
      text-transform: lowercase;
      color: #1a1a1a;
    }

    .subtitle {
      font-size: 15px;
      color: #7a6a53;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 10px;
      border-bottom: 1px solid #d5c9b2;
      padding-bottom: 20px;
      display: inline-block;
    }

    .art-card {
      background: #ffffff;
      border: 1px solid #d5c9b2;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: box-shadow 0.3s;
    }

    .art-card:hover {
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .art-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px dashed #e0d8c8;
    }

    .art-id {
      font-family: 'Courier New', monospace;
      font-size: 16px;
      color: #7a6a53;
      font-weight: bold;
    }

    .art-frame {
      width: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .art-frame canvas {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }

    .copy-btn {
      background: transparent;
      color: #2c2c2c;
      border: 1px solid #2c2c2c;
      padding: 8px 16px;
      cursor: pointer;
      font-family: 'Times New Roman', Times, serif;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #2c2c2c;
      color: #fdf6e3;
    }

    .copy-btn.copied {
      background: #7a6a53;
      border-color: #7a6a53;
      color: #fff;
    }

    .loading, .error {
      font-style: italic;
      color: #7a6a53;
      padding: 50px 0;
      text-align: center;
      font-size: 18px;
    }
    .error { color: #a94442; }

    footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #d5c9b2;
      text-align: center;
      font-size: 13px;
      color: #7a6a53;
      font-style: italic;
    }

    @media (max-width: 600px) {
      body { padding: 20px 10px; }
      .art-card { padding: 15px; }
      h1 { font-size: 32px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>ink88</h1>
      <div class="subtitle">ASCII Art Archive</div>
    </header>

    <main id="artContainer">
      <div class="loading">Loading archive...</div>
    </main>

    <footer>
      Copyright : mohamed005cheikh@gmail.com | by MC88
    </footer>
  </div>

  <script>
    const container = document.getElementById('artContainer');
    const MAX_INDEX = 500;
    const MAX_MISSES = 3;

    async function loadAll() {
      container.innerHTML = '';
      let found = 0;
      let misses = 0;

      for (let i = 1; i <= MAX_INDEX && misses < MAX_MISSES; i++) {
        try {
          // جلب الملف النصي
          const res = await fetch(i + '.txt', { cache: 'no-cache' });
          if (!res.ok) throw new Error('miss');
          const text = (await res.text()).replace(/\r\n/g, '\n');
          
          if (text.trim().length > 0) {
            renderArt(text.replace(/\n+$/, ''), '#' + String(i).padStart(3, '0'));
            found++;
            misses = 0;
          } else {
            misses++;
          }
        } catch (e) {
          misses++;
        }
      }

      if (found === 0) {
        container.innerHTML =
          '<div class="error">No artworks found.<br>Add files named <b>1.txt</b>, <b>2.txt</b>, <b>3.txt</b>, ...</div>';
      }
    }

    function renderArt(art, idStr) {
      const card = document.createElement('div');
      card.className = 'art-card';

      const header = document.createElement('div');
      header.className = 'art-header';

      const idSpan = document.createElement('span');
      idSpan.className = 'art-id';
      idSpan.textContent = idStr;

      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Copy Text';
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(art).then(() => {
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = 'Copy Text';
            btn.classList.remove('copied');
          }, 1500);
        });
      });

      header.appendChild(idSpan);
      header.appendChild(btn);

      const frame = document.createElement('div');
      frame.className = 'art-frame';

      const canvas = document.createElement('canvas');
      drawAsciiToCanvas(canvas, art);
      
      frame.appendChild(canvas);
      card.appendChild(header);
      card.appendChild(frame);
      container.appendChild(card);
    }

    // === دالة الرسم المعدلة (مطابقة تماماً لمنطق Symboles88) ===
    function drawAsciiToCanvas(canvas, text) {
      const lines = text.split('\n');
      const cols = Math.max(1, ...lines.map(l => l.length));
      const rows = Math.max(1, lines.length);

      // نفس المقاسات الموجودة في مشروعك الأول
      const fontSize = 12;
      const charWidth = fontSize * 0.6;
      const charHeight = fontSize * 1.1;

      const ctx = canvas.getContext('2d');

      canvas.width = Math.ceil(cols * charWidth);
      canvas.height = Math.ceil(rows * charHeight);

      // خلفية بيضاء
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = `${fontSize}px monospace`;
      ctx.fillStyle = '#1a1a1a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // السر هنا: رسم النص حرفاً بحرف في إحداثيات دقيقة (Grid)
      for (let y = 0; y < rows; y++) {
        const line = lines[y] || '';
        for (let x = 0; x < cols; x++) {
          const char = line[x];
          
          // نتجاهل المسافات الفارغة لتسريع الأداء، ونرسم الرموز فقط في مكانها الصحيح
          if (char && char !== ' ') {
            const posX = (x * charWidth) + (charWidth / 2);
            const posY = (y * charHeight) + (charHeight / 2);
            ctx.fillText(char, posX, posY);
          }
        }
      }
    }

    loadAll();
  </script>

</body>
</html>
