<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ink88 - ASCII Art</title>
  <style>
    body {
      background-color: #fdf6e3;
      color: #2c2c2c;
      font-family: 'Times New Roman', Times, serif;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fffefc;
      border: 1px solid #d5c9b2;
      padding: 30px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
    }

    header {
      border-bottom: 2px solid #2c2c2c;
      margin-bottom: 20px;
      padding-bottom: 10px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin: 0;
      font-weight: normal;
      letter-spacing: 4px;
      text-transform: lowercase;
    }

    .subtitle {
      font-size: 14px;
      color: #7a6a53;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .catalog-header {
      display: flex;
      font-size: 14px;
      font-weight: bold;
      color: #7a6a53;
      border-bottom: 1px solid #2c2c2c;
      padding-bottom: 5px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .col-id { width: 70px; flex-shrink: 0; }
    .col-content { flex-grow: 1; padding: 0 20px; min-width: 0; }
    .col-action { width: 110px; flex-shrink: 0; text-align: right; }

    .art-row {
      display: flex;
      border-bottom: 1px solid #e0d8c8;
      padding: 24px 0;
      align-items: flex-start;
      transition: background 0.2s;
    }

    .art-row:hover {
      background-color: #f7f2e6;
    }

    .art-id {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #7a6a53;
      padding-top: 20px;
    }

    /* === The white frame — like Symboles88's canvas === */
    .art-frame {
      background: #ffffff;
      border: 1px solid #e8e0cc;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 60px;
    }

    /* The rendered art canvas — auto-scales to fit the frame */
    .art-frame canvas {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }

    .copy-btn {
      background: transparent;
      color: #2c2c2c;
      border: 1px solid #2c2c2c;
      padding: 6px 14px;
      cursor: pointer;
      font-family: 'Times New Roman', Times, serif;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #2c2c2c;
      color: #fdf6e3;
    }

    .copy-btn.copied {
      background: #7a6a53;
      border-color: #7a6a53;
      color: #fff;
    }

    .loading, .error {
      font-style: italic;
      color: #7a6a53;
      padding: 30px 0;
      text-align: center;
    }
    .error { color: #a94442; }

    footer {
      margin-top: 40px;
      padding-top: 15px;
      border-top: 1px solid #2c2c2c;
      text-align: center;
      font-size: 13px;
      color: #7a6a53;
      font-style: italic;
    }

    @media (max-width: 600px) {
      body { padding: 20px 10px; }
      .container { padding: 20px 15px; }
      .catalog-header { display: none; }
      .art-row { flex-direction: column; align-items: stretch; }
      .col-id { width: 100%; margin-bottom: 10px; padding-top: 0; }
      .col-content { padding: 0; }
      .col-action { width: 100%; text-align: left; margin-top: 15px; }
      .art-frame { padding: 8px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>ink88</h1>
      <div class="subtitle">ASCII Art Archive</div>
    </header>

    <div class="catalog-header">
      <div class="col-id">ID</div>
      <div class="col-content">Artwork</div>
      <div class="col-action">Action</div>
    </div>

    <main id="artContainer">
      <div class="loading">Loading archive...</div>
    </main>

    <footer>
      copyright : mohamed005cheikh@gmail.com | by MC88
    </footer>
  </div>

  <script>
    const container = document.getElementById('artContainer');
    const MAX_INDEX = 500;
    const MAX_MISSES = 3;

    // Base font size used when drawing to canvas
    // Higher = crisper when scaled down, more memory
    const BASE_FONT_SIZE = 16;
    const CHAR_W_RATIO = 0.6;   // monospace width per char (Courier New)
    const LINE_H_RATIO = 1.1;   // line height

    async function loadAll() {
      container.innerHTML = '';
      let found = 0;
      let misses = 0;

      for (let i = 1; i <= MAX_INDEX && misses < MAX_MISSES; i++) {
        try {
          const res = await fetch(i + '.txt', { cache: 'no-cache' });
          if (!res.ok) throw new Error('miss');
          const text = (await res.text()).replace(/\r\n/g, '\n');
          if (text.trim().length > 0) {
            renderArt(text.replace(/\n+$/, ''), '#' + String(i).padStart(3, '0'));
            found++;
            misses = 0;
          } else {
            misses++;
          }
        } catch (e) {
          misses++;
        }
      }

      if (found === 0) {
        container.innerHTML =
          '<div class="error">No artworks found.<br>Add files named <b>1.txt</b>, <b>2.txt</b>, <b>3.txt</b>, ...</div>';
      }
    }

    function renderArt(art, idStr) {
      const row = document.createElement('div');
      row.className = 'art-row';

      const idCol = document.createElement('div');
      idCol.className = 'col-id art-id';
      idCol.textContent = idStr;

      const contentCol = document.createElement('div');
      contentCol.className = 'col-content';

      const frame = document.createElement('div');
      frame.className = 'art-frame';

      const canvas = document.createElement('canvas');
      drawAsciiToCanvas(canvas, art);
      frame.appendChild(canvas);
      contentCol.appendChild(frame);

      const actionCol = document.createElement('div');
      actionCol.className = 'col-action';

      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(art).then(() => {
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = 'Copy';
            btn.classList.remove('copied');
          }, 1500);
        }).catch(() => {
          btn.textContent = 'Failed';
          setTimeout(() => btn.textContent = 'Copy', 1500);
        });
      });

      actionCol.appendChild(btn);

      row.appendChild(idCol);
      row.appendChild(contentCol);
      row.appendChild(actionCol);
      container.appendChild(row);
    }

    // === Core: render ASCII text into a canvas — same approach as Symboles88 ===
    function drawAsciiToCanvas(canvas, text) {
      const lines = text.split('\n');
      const cols = Math.max(1, ...lines.map(l => l.length));
      const rows = Math.max(1, lines.length);

      const fontSize = BASE_FONT_SIZE;
      const charH = fontSize * LINE_H_RATIO;

      // Setup temporary context to measure character width precisely
      const ctx = canvas.getContext('2d');
      ctx.font = fontSize + 'px "Courier New", Consolas, monospace';
      const charW = ctx.measureText('M').width || (fontSize * CHAR_W_RATIO);

      // Intrinsic canvas resolution
      canvas.width = Math.ceil(cols * charW);
      canvas.height = Math.ceil(rows * charH);

      // Reapply font after resizing the canvas (canvas resize resets context state)
      ctx.font = fontSize + 'px "Courier New", Consolas, monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#1a1a1a';
      ctx.textBaseline = 'top';

      // Draw each line as one string — monospace handles spacing automatically
      for (let y = 0; y < lines.length; y++) {
        const line = lines[y];
        if (!line) continue;
        ctx.fillText(line, 0, y * charH);
      }
    }

    loadAll();
  </script>

</body>
</html>
